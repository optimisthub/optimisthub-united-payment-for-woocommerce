name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint and standards (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax check
        run: |
          find . -path ./vendor -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 php -l > /dev/null
          echo "All PHP files pass syntax check."

      - name: Install development dependencies
        if: matrix.php == '8.1'
        run: composer install --prefer-dist --no-interaction

      - name: WordPress and WooCommerce Coding Standards
        if: matrix.php == '8.1'
        run: vendor/bin/phpcs --standard=phpcs.xml.dist --report=summary
        continue-on-error: true

  security:
    name: Dependency security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Audit runtime dependencies
        run: composer audit --no-dev
